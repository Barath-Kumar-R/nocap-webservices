<!--
  Canonical NoCap polish block (v1). tools/apply-polish.cjs fills the {{PLACEHOLDERS}} and splices the three
  parts into a demo: css into the page's last <style>, noscript right after it, body just before </body>.
  Keep it small: it is inlined into every demo. Parts are split on the "nc:" comments below.
-->
<!-- nc:css -->
<style>
/* nocap:polish v1 */
:root{--nc-bg:{{BG}};--nc-fg:{{FG}};--nc-accent:{{ACCENT}};--nc-on-accent:{{ON_ACCENT}};--nc-radius:10px;--nc-bar-h:calc(65px + env(safe-area-inset-bottom,0px))}
:focus-visible{outline:3px solid #111!important;outline-offset:2px;box-shadow:0 0 0 2px #fff!important}
.nc-bar{display:none}
@media (max-width:720px){
  html{scroll-padding-bottom:var(--nc-bar-h)}
  body{padding-bottom:var(--nc-bar-h)}
  .nc-bar{position:fixed;left:0;right:0;bottom:0;z-index:95;display:flex;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--nc-bg);border-top:1px solid rgba(128,128,128,.4);font-size:16px;font-weight:700;line-height:1.2}
  .nc-bar a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 14px;border:2px solid var(--nc-fg);border-radius:var(--nc-radius);color:var(--nc-fg);text-decoration:none}
  .nc-bar a.nc-book{background:var(--nc-accent);border-color:var(--nc-accent);color:var(--nc-on-accent)}
  .nc-bar svg{width:20px;height:20px;flex:none}
  body .wa-float{bottom:calc(var(--nc-bar-h) + 14px)}
  body:has(.wa-float){padding-bottom:calc(var(--nc-bar-h) + 72px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important;scroll-behavior:auto!important}
  [class*="reveal"],[data-reveal],.fade-in,.fade-up{opacity:1!important;transform:none!important}
}
</style>
<!-- nc:noscript -->
<noscript><style>[class*="reveal"],[data-reveal],.fade-in,.fade-up{opacity:1!important;transform:none!important;visibility:visible!important}</style></noscript>
<!-- nc:body -->
<div class="nc-bar" role="group" aria-label="Call or book">
  <a class="nc-call" href="{{TEL}}"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>Call</a>
  <a class="nc-book" href="{{BOOK}}">Book</a>
</div>
<script>
/* nocap:polish v1 */
(function () {
  var bar = document.querySelector('.nc-bar');
  if (!bar) return;
  // Match page padding and the WhatsApp float to the bar's real height (larger text sizes, safe areas).
  function fit() {
    if (bar.offsetHeight) document.documentElement.style.setProperty('--nc-bar-h', bar.offsetHeight + 'px');
  }
  fit();
  addEventListener('resize', fit);
  // Without IntersectionObserver the demo's own scroll reveal never fires; show everything instead.
  if (!('IntersectionObserver' in window)) {
    document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); });
  }
})();
</script>
